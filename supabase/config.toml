project_id = "moc-workspace"

# Only declared properties are pushed. Provider secrets are read from the
# authenticated setup command's environment, never committed to this file.
[auth]
site_url = "https://moc-workspace.vercel.app"
additional_redirect_urls = ["https://moc-workspace.vercel.app/api/auth/callback", "http://localhost:5173/api/auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
